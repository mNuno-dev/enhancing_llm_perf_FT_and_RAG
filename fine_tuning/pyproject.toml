[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gervasio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "evaluate",
    "envil",
    "datasets",
    "humanize",
    "huggingface_hub",
    "numpy",
    "peft",
    "transformers",
    "torch",
    "matplotlib",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]
